# docker-compose.yaml (обновленная часть)
services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    # Мы убираем выставление порта 8000 наружу, так как Nginx будет проксировать запросы
    # ports:
    #   - "8000:8000"
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      # Добавляем volume для статических и медиа файлов, чтобы Nginx мог к ним получить доступ
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery_beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  nginx: # Новый сервис Nginx
    image: nginx:alpine
    ports:
      - "80:80" # Nginx слушает на порту 80
    volumes:
      - ./nginx:/etc/nginx/conf.d # Монтируем наш конфигурационный файл Nginx
      - static_files:/app/staticfiles # Монтируем те же volume для статики, что и у backend
      - media_files:/app/mediafiles # Монтируем те же volume для медиа, что и у backend
    depends_on:
      - backend # Nginx зависит от backend, чтобы он запустился после Django

volumes:
  postgres_data:
  static_files: # Новый volume для статических файлов
  media_files: # Новый volume для медиа файлов