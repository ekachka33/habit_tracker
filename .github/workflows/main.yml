# .github/workflows/main.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - master # Убедитесь, что это ветка, в которую вы пушите
      - develop # Если вы хотите, чтобы пайплайн запускался и на develop
  pull_request:
    branches:
      - master # Убедитесь, что это ветка, в которую вы отправляете PR
      - develop # Если вы хотите, чтобы пайплайн запускался и на PR в develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB_TEST }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER_TEST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # *** ВОТ ГДЕ ОШИБКА БЫЛА! steps должен быть на уровне services,
    # но внутри build-and-test ***
    steps: # <-- Этот 'steps' должен быть на одном уровне с 'services'
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt # Убедитесь, что psycopg2-binary есть в requirements.txt!

      - name: Wait for PostgreSQL to be ready
        run: |
          while ! pg_isready -h localhost -p 5432 -U ${{ vars.POSTGRES_USER_TEST }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}

      - name: Run Django tests
        run: |
            echo "--- Environment variables for Django tests ---"
            env | grep POSTGRES # Выводим переменные окружения для POSTGRES
            env | grep SECRET_KEY # Выводим SECRET_KEY (частично)
            echo "--------------------------------------------"
            
            # Попробуем подключиться к PostgreSQL напрямую через psql
            # Это должно проверить, что СУБД доступна с данными учетными данными
            psql -h localhost -p 5432 -U ${{ vars.POSTGRES_USER_TEST }} -d ${{ vars.POSTGRES_DB_TEST }} -c "SELECT 1;" || true
            # Если psql выдаст ошибку, но мы хотим, чтобы workflow продолжался, используем || true
            
            python manage.py test
          env:
            SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
            POSTGRES_DB: ${{ vars.POSTGRES_DB_TEST }}
            POSTGRES_USER: ${{ vars.POSTGRES_USER_TEST }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
            POSTGRES_HOST: localhost
            POSTGRES_PORT: 5432

      - name: Run Linter (Flake8)
        run: |
          pip install flake8
          flake8 .

      - name: Check Docker Compose build
        run: docker compose build --no-pull

