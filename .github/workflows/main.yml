# .github/workflows/main.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Используйте версию Python, которая указана в вашем Dockerfile / requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: |
          # Установите необходимые переменные окружения для тестов
          # Например, для подключения к базе данных, если тесты её используют
          # Это будут временные переменные для CI, а не для продакшена
          echo "DATABASE_URL=sqlite:///./test_db.sqlite3" >> $GITHUB_ENV
          # Устанавливаем SECRET_KEY из Secrets GitHub
          echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> $GITHUB_ENV
          python manage.py test
        env: # Это важно: мы явно передаем SECRET_KEY в окружение шага
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}


      - name: Run Linter (Flake8)
        run: |
          pip install flake8
          flake8 .

      - name: Check Docker Compose build
        run: docker compose build --no-pull
